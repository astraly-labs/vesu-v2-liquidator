# Generated by the review-loop skill. Edit freely.
#
# NOTE: this repository has no CI. Every command below exists only in the Makefile
# (or not at all, for `test`), so all of them are advisory rules that nothing
# enforces on push or merge.
gates:
  # `make format`, verbatim.
  lint: cargo fmt -- --check && cargo clippy --no-deps -- -D warnings && cargo clippy --tests --no-deps -- -D warnings
  test: cargo test
  # No baseline: `main` does not compile, so it has no green suite to diff against.
  baseline: null

critical_paths: # ordered by cost of error
  - src/services/monitoring/** # decides to liquidate and signs the transaction
  - src/types/position.rs # LTV maths that gates every liquidation
  - src/types/account.rs # key handling and transaction submission
  - src/services/oracle/** # the prices every decision is computed from
  - src/services/indexer/** # position state is rebuilt from this event stream

gate_files: # weakening these is blocking, always
  - Makefile
  - .github/workflows/**
  - rust-toolchain.toml
  - Cargo.toml

invariants: # prose; candidates for property tests
  - "A liquidation is never sent on a missing or stale price."
  - "A liquidation transaction is never replayed automatically; only idempotent reads are retried."
  - "No outbound network call waits without a deadline."
  - "A position delta is applied exactly once."
  - "A user-reachable failure is an error, never a panic."
  - "An asset referenced by a monitored pair always exists in config/assets.toml."

extinct: []
